[project]
name = "mock-interview-agent"
version = "0.1.0"
description = "AI 面试官：基于简历与知识集的模拟面试 Agent"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain-deepseek>=0.1",
    "langgraph>=0.2",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "qdrant-client>=1.9",
    "elasticsearch>=8.13,<9",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["docker"]  # 供应商内容（模型 README 等）不参与检查/格式化

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is standard

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
